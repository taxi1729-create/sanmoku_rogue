<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b0f1e" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- faint 4x4 grid hint -->
  <g stroke="#818cf8" stroke-opacity="0.16" stroke-width="6">
    <line x1="152" y1="0" x2="152" y2="1024"/><line x1="872" y1="0" x2="872" y2="1024"/>
    <line x1="0" y1="152" x2="1024" y2="152"/><line x1="0" y1="872" x2="1024" y2="872"/>
  </g>

  <!-- board cells (2x2 window of the 4x4 board) -->
  <g fill="url(#cell)" stroke="#a5b4fc" stroke-opacity="0.38" stroke-width="8">
    <rect x="186" y="186" width="292" height="292" rx="44"/>
    <rect x="546" y="186" width="292" height="292" rx="44"/>
    <rect x="186" y="546" width="292" height="292" rx="44"/>
    <rect x="546" y="546" width="292" height="292" rx="44"/>
  </g>

  <!-- off-line symbols (slightly dimmer) -->
  <g fill="none" stroke-width="52" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" opacity="0.82">
    <path d="M622 262 L762 402 M762 262 L622 402" stroke="#f472b6"/>
    <rect x="250" y="610" width="164" height="164" rx="16" stroke="#fbbf24"/>
  </g>

  <!-- beam glow under -->
  <line x1="40" y1="40" x2="984" y2="984" stroke="#fde68a" stroke-width="120" stroke-opacity="0.45" filter="url(#bigglow)"/>

  <!-- on-line symbols -->
  <g fill="none" stroke-width="56" stroke-linecap="round" filter="url(#glow)">
    <circle cx="332" cy="332" r="90" stroke="#7dd3fc"/>
    <path d="M692 608 L784 770 L600 770 Z" stroke="#4ade80" stroke-linejoin="round"/>
  </g>

  <!-- the cross line beam -->
  <line x1="20" y1="20" x2="1004" y2="1004" stroke="url(#beam)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="60" y1="60" x2="964" y2="964" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- center sparkle -->
  <g transform="translate(512 512)" filter="url(#glow)">
    <path d="M0 -120 C10 -22 22 -10 120 0 C22 10 10 22 0 120 C-10 22 -22 10 -120 0 C-22 -10 -10 -22 0 -120 Z" fill="#fffbeb"/>
    <circle r="26" fill="#ffffff"/>
  </g>
</svg>
